[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Enzo Huanca", email = "enzo.huanca.a@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "shared-core",
    "sqlalchemy>=2.0.54",
    "typer>=0.27.2",
]

[project.scripts]
knowledge-assistant = "knowledge_assistant:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
shared-core = { path = "../shared_core", editable = true }
