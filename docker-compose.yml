# Default stack (Feature 0010):   docker compose up -d --build
#   postgres + api + frontend
# Optional profiles:
#   --profile ollama    containerized Ollama with GPU (set OLLAMA_BASE_URL=http://ollama:11434)
#   --profile airflow   Airflow orchestration (Phase 5)
# Requires a `.env` file next to this one (copy `.env.example`).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env (copy .env.example)}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:latest}
      RATE_LIMIT_DEFAULT_PER_MINUTE: ${RATE_LIMIT_DEFAULT_PER_MINUTE:-120}
      RATE_LIMIT_EXPENSIVE_PER_MINUTE: ${RATE_LIMIT_EXPENSIVE_PER_MINUTE:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - datasets_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:?Set API_KEY in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: portfolio-ollama
    restart: unless-stopped
    ports:
      # Not 11434: a manually started Ollama usually owns that port.
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  airflow-postgres:
    profiles: ["airflow"]
    image: postgres:16-alpine
    container_name: portfolio-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow:
    profiles: ["airflow"]
    build: ./infrastructure/airflow
    container_name: portfolio-airflow
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      # Consumed by ingestion_pipeline.config.Settings inside the DAG.
      # Uses the "postgres" service name (Docker network alias), not
      # localhost -- this container reaches it over the compose network,
      # not through the host's port mapping.
      DATABASE_URL: postgresql+psycopg2://portfolio:portfolio@postgres:5432/portfolio
      PYTHONPATH: /opt/airflow/ingestion_pipeline_src
    volumes:
      - ./infrastructure/airflow/dags:/opt/airflow/dags
      - ./infrastructure/airflow/logs:/opt/airflow/logs
      - ./infrastructure/airflow/plugins:/opt/airflow/plugins
      - ./backend/datasets:/opt/airflow/data/datasets:ro
      - ./backend/ingestion_pipeline/src/ingestion_pipeline:/opt/airflow/ingestion_pipeline_src/ingestion_pipeline:ro
    ports:
      - "8080:8080"
    command: standalone

volumes:
  postgres_data:
  airflow_postgres_data:
  ollama_data:
  datasets_data:
